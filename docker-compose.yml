# VPN-бот на ДОМАШНЕМ сервере рядом с панелью Remnawave.
#   vpnbot    — сам бот.
#   tg-egress — ОПЦИОНАЛЬНО (profile "egress"): Xray-клиент SOCKS5 -> VLESS Reality -> FIN. Нужен, только если у
#               домашнего сервера нет западного выхода (Telegram в РФ заблокирован). Если сервер сидит в Wi-Fi/сети
#               роутера с VPN — не нужен, бот ходит в Telegram напрямую (TELEGRAM_PROXY пуст). К панели ходит по docker-сети remnawave-network (http://remnawave:3000), туннель/TLS не нужны.
#   postgres  — основная БД бота (отдельная от БД панели, в своей docker-сети vpnbot-net; порт наружу не публикуется).
# Ни один порт на хост не публикуется. Бот работает через long polling (только исходящие соединения) —
# проброс портов на роутере по-прежнему не нужен. Веб-админка бота (порт 8088) видна только в docker-сети
# remnawave-network: её проксирует Caddy панели на туннельном адресе 10.66.0.2:443 (07-bot-home.sh дописывает блок).
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  tg-egress:
    image: ghcr.io/xtls/xray-core:${XRAY_TAG:-latest}   # после проверки зафиксируйте точную версию в .env (XRAY_TAG)
    container_name: tg-egress
    profiles: ["egress"]                                # включается COMPOSE_PROFILES=egress (ставит 07-bot-home.sh)
    restart: always
    <<: *logging
    volumes:
      - ./egress:/usr/local/etc/xray:ro                 # config.json создаёт tools/vless2xray.py
    networks: [bot-net]
    mem_limit: 96m

  postgres:
    image: postgres:${PG_TAG:-17-alpine}
    container_name: vpnbot-postgres
    restart: always
    <<: *logging
    environment:
      POSTGRES_USER: vpnbot
      POSTGRES_DB: vpnbot
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD не задан в .env}
    volumes:
      - vpnbot-pg:/var/lib/postgresql/data
    networks: [bot-net]
    mem_limit: 256m
    shm_size: 64m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnbot -d vpnbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  vpnbot:
    build: .
    image: vpnbot:local
    container_name: vpnbot
    restart: always
    <<: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vpnbot:${PG_PASSWORD}@postgres:5432/vpnbot
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
    networks: [bot-net, remnawave-network]
    mem_limit: 192m
    healthcheck:
      # маркер обновляется раз в минуту, только если Telegram реально отвечает через прокси
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime(os.environ.get('HEARTBEAT_FILE','/tmp/vpnbot.alive'))<180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  vpnbot-pg:
    name: vpnbot-pg

networks:
  bot-net:
    name: vpnbot-net
  remnawave-network:
    external: true      # сеть панели из 06-panel-home.sh

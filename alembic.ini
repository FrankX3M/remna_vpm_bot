# Для ручной работы: DATABASE_URL=postgresql+asyncpg://... alembic upgrade head
# Бот сам применяет миграции при старте (app/migrate.py).
[alembic]
script_location = app/migrations
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
